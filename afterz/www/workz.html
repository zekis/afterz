<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ app_name or "Workz - Unified Workspace" }}</title>
    <meta name="description" content="{{ description or 'Unified workspace for todos, planning, and time tracking' }}">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/assets/frappe/images/frappe-favicon.svg">
    
    {% if frappe.conf.developer_mode %}
    <!-- Development mode: Load from Vite dev server -->
    <script>
        console.log('Loading in development mode from Vite dev server');
    </script>
    {% else %}
    <!-- Production mode: Load built assets -->
    <link rel="stylesheet" href="/assets/afterz/frontend/index.css">
    <script>
        console.log('Loading in production mode from built assets');
    </script>
    {% endif %}
</head>
<body>
    <div id="workz-root">
        <!-- Loading fallback -->
        <div style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background-color: #f8fafc;">
            <div style="text-align: center;">
                <div style="width: 32px; height: 32px; border: 3px solid #e2e8f0; border-top: 3px solid #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px;"></div>
                <p style="color: #64748b; font-family: system-ui, -apple-system, sans-serif;">Loading Workz...</p>
            </div>
        </div>
    </div>
    
    <style>
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    
    <!-- Frappe Context Injection -->
    <script>
        // CRITICAL: Inject Frappe context before React loads
        window.frappe_boot = {{ boot | tojson }};
        window.frappeBootAvailable = true;
        
        // Debug logging
        console.log('Frappe boot data loaded:', window.frappe_boot ? 'Yes' : 'No');
        if (window.frappe_boot) {
            console.log('Current user:', window.frappe_boot.user?.full_name || 'Unknown');
            console.log('Site name:', window.frappe_boot.sitename);
        }
    </script>
    
    {% if frappe.conf.developer_mode %}
    <!-- Development mode: Load from Vite dev server -->
    <script type="module" src="http://localhost:8080/src/main.tsx"></script>
    {% else %}
    <!-- Production mode: Load built assets -->
    <script type="module" src="/assets/afterz/frontend/index.js"></script>
    {% endif %}
    
    <script>
        // Fallback error handling
        window.addEventListener('error', function(e) {
            console.error('Application error:', e.error);
            document.getElementById('workz-root').innerHTML = `
                <div style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background-color: #f8fafc;">
                    <div style="text-align: center; max-width: 400px; padding: 20px;">
                        <div style="color: #dc2626; font-size: 48px; margin-bottom: 16px;">⚠️</div>
                        <h1 style="color: #1e293b; font-family: system-ui, -apple-system, sans-serif; margin-bottom: 8px;">Application Error</h1>
                        <p style="color: #64748b; font-family: system-ui, -apple-system, sans-serif; margin-bottom: 16px;">
                            Failed to load the Workz application. Please refresh the page or contact your administrator.
                        </p>
                        <button onclick="window.location.reload()" style="background-color: #3b82f6; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-family: system-ui, -apple-system, sans-serif;">
                            Refresh Page
                        </button>
                    </div>
                </div>
            `;
        });
        
        // Timeout fallback if app doesn't load
        setTimeout(function() {
            const root = document.getElementById('workz-root');
            if (root && root.innerHTML.includes('Loading Workz')) {
                console.warn('Application load timeout - showing fallback message');
                root.innerHTML = `
                    <div style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background-color: #f8fafc;">
                        <div style="text-align: center; max-width: 400px; padding: 20px;">
                            <div style="color: #f59e0b; font-size: 48px; margin-bottom: 16px;">⏱️</div>
                            <h1 style="color: #1e293b; font-family: system-ui, -apple-system, sans-serif; margin-bottom: 8px;">Loading Timeout</h1>
                            <p style="color: #64748b; font-family: system-ui, -apple-system, sans-serif; margin-bottom: 16px;">
                                The application is taking longer than expected to load. This might be due to network issues or the development server not running.
                            </p>
                            <button onclick="window.location.reload()" style="background-color: #3b82f6; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-family: system-ui, -apple-system, sans-serif;">
                                Retry
                            </button>
                        </div>
                    </div>
                `;
            }
        }, 10000); // 10 second timeout
    </script>
</body>
</html>
